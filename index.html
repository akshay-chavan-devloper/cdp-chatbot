  <!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>CDP Chatbot</title> 
    <style> 
        body { font-family: Arial, sans-serif; margin: 50px; }         .chatbox { width: 100%; max-width: 600px; margin: 0 auto; } 
        .message { padding: 10px; background-color: #f1f1f1; margin-bottom: 10px; border-radius: 5px; }         .user-message { background-color: #e0f7fa; } 
        .bot-message { background-color: #c8e6c9; } 
    </style> 
</head> 
<body> 
    <h1>CDP Support Agent Chatbot</h1> 
    <div class="chatbox" id="chatbox"></div> 
    <input type="text" id="user-input" placeholder="Ask a question..." style="width: 100%; padding: 10px;">     <button onclick="sendMessage()">Send</button> 
 
    <script> 
        function sendMessage() { 
            const userInput = document.getElementById("userinput").value;             const chatbox = 
document.getElementById("chatbox"); 
 
            if (userInput.trim() === "") return; 
 
            // Display user message             const userMessageDiv = document.createElement("div"); 
            userMessageDiv.classList.add("message", "usermessage"); 
            userMessageDiv.innerHTML = userInput;             chatbox.appendChild(userMessageDiv); 
 
            // Send message to Flask API 
            fetch("/ask", {                 method: "POST", 
                headers: { "Content-Type": "application/json" },                 body: JSON.stringify({ question: userInput }) 
            }) 
            .then(response => response.json()) 
            .then(data => { 
                // Display bot response                 const botMessageDiv = document.createElement("div"); 
                botMessageDiv.classList.add("message", "botmessage"); 
                botMessageDiv.innerHTML = data.answer;                 chatbox.appendChild(botMessageDiv); 
 
                // Scroll chatbox to the bottom 
                chatbox.scrollTop = chatbox.scrollHeight; 
            }); 
        } 
    </script> 
</body> 
</html>
